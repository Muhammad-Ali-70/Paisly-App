<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Paisly project cover</title>
<style>
  @font-face { font-family: 'Manrope'; src: url('../manrope.woff2') format('woff2'); font-weight: 200 800; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1500px; height: 1200px; overflow: hidden; }
  body {
    font-family: 'Manrope', sans-serif; color: #f8fafc; position: relative;
    background:
      radial-gradient(circle at 78% 62%, rgba(16,185,129,.32), transparent 45%),
      radial-gradient(circle at 8% 0%, rgba(16,185,129,.12), transparent 35%),
      linear-gradient(160deg, #0f172a, #0b1222);
  }
  body::before {
    content: ''; position: absolute; inset: 0; opacity: .22;
    background-image: linear-gradient(rgba(148,163,184,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.18) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 70% 70% at 30% 45%, #000 15%, transparent 75%);
  }
  .copy { position: absolute; left: 100px; top: 0; bottom: 0; width: 680px; display: flex; flex-direction: column; justify-content: center; }
  .mark { width: 120px; height: 120px; margin-bottom: 44px; }
  h1 { font-size: 168px; line-height: .95; font-weight: 800; letter-spacing: -6px; }
  .tagline { margin-top: 26px; font-size: 48px; font-weight: 700; letter-spacing: -1px; color: #34d399; }
  .sub { margin-top: 22px; font-size: 32px; line-height: 1.4; font-weight: 500; color: #94a3b8; }
  .live {
    margin-top: 52px; align-self: flex-start; display: flex; align-items: center; gap: 16px;
    padding: 18px 30px; border-radius: 99px; background: rgba(16,185,129,.12); border: 2px solid rgba(16,185,129,.5);
    font-size: 28px; font-weight: 700; color: #6ee7b7;
  }
  .live i { width: 14px; height: 14px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 8px rgba(16,185,129,.22); }

  .phone {
    position: absolute; width: 400px; aspect-ratio: 1080 / 2424; border-radius: 60px; padding: 12px;
    background: #1e293b; border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 50px 100px rgba(0,0,0,.55);
  }
  .phone img { width: 100%; height: 100%; display: block; border-radius: 49px; object-fit: cover; }
  .back  { left: 1010px; top: 230px; transform: rotate(10deg); }
  .front { left: 790px; top: 150px; transform: rotate(-4deg); z-index: 2; box-shadow: 0 60px 120px rgba(0,0,0,.6), 0 0 140px rgba(16,185,129,.28); }
  .fade { position: absolute; left: 700px; right: 0; bottom: 0; height: 200px; z-index: 3;
    background: linear-gradient(180deg, transparent, #0b1222 85%); }
</style>
</head>
<body>
  <div class="copy">
    <svg class="mark" viewBox="353 231 794 1038"><path fill="#10b981" d="M 1146.613281 475.070312 L 1146.613281 780.28125 L 913.410156 780.28125 L 913.410156 464.792969 L 353.378906 464.792969 L 353.378906 231.585938 L 906.476562 231.585938 C 949.445312 275.710938 1061.324219 389.050781 1146.613281 475.070312 Z M 353.378906 1035.507812 L 586.585938 1268.433594 L 586.585938 1013.488281 L 913.429688 1013.488281 L 913.429688 780.28125 L 353.378906 780.28125 Z"/></svg>
    <h1>Paisly</h1>
    <div class="tagline">Expense &amp; Udhar Book</div>
    <p class="sub">Kharcha, udhar and budgets<br>in one simple app.</p>
    <div class="live"><i></i>Live on Google Play</div>
  </div>
  <div class="phone back"><img src="../screenshots/raw/udhar.png"></div>
  <div class="phone front"><img src="../screenshots/raw/home.png"></div>
  <div class="fade"></div>
</body>
</html>
